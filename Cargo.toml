[workspace]
resolver = "2"
members = ["crates/engine", "crates/cli", "src-tauri", "crates/gpui"]

[workspace.package]
edition = "2021"
rust-version = "1.88"
version = "0.1.0"
license = "MIT OR Apache-2.0"

# Excalibur speaks four protocols and does every byte of I/O in Rust. The
# lints below are the same discipline the sibling xsync workspace runs under:
# a file browser that mishandles a path is a security problem, not a bug.
[workspace.lints.rust]
# `deny`, not `forbid`: the presumption, not an absolute. Where no adequate safe
# crate exists, a module may `#![allow(unsafe_code)]` for itself — never the
# crate, never the workspace — with a `// SAFETY:` note on every block and a
# tested safe wrapper around it. See "Decisions taken" in legacy/plan.md. Held as an
# absolute, this lint deleted a feature from the sibling xsync project rather
# than answering a question about it, which is the wrong way round.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4"
# Host key fingerprints (E3-S4). All three are already in the tree via other
# dependencies, so naming them here adds no new crates to audit.
sha2 = "0.10"
base64 = "0.22"
dirs = "6"
# SFTP (E6). Exact-pinned as the plan asks: an SSH client is the one
# dependency where a surprise minor bump is a security-relevant change.
russh = "=0.63.2"
russh-sftp = "=2.4.0"
# The NFSv3 wire codec (E5). Unlicense, zero `unsafe`, and two direct
# dependencies. It is a codec rather than a client — no DNS, no pool, no retry,
# no path layer — so the session layer above it is ours; see backend/nfs.rs.
nfs3_client = { version = "0.9.0", default-features = false, features = ["tokio"] }
# The SMB client, behind the engine's off-by-default `smb` feature.
#
# It wraps libsmbclient, which is GPL-3.0-or-later. Enabling that feature makes
# the shipped binary GPLv3 as a whole; the default build does not link it and
# stays MIT OR Apache-2.0. See docs/decisions/0001-smb-client.md.
pavao = "0.3.1"
# Only under the engine's `smb` feature, and only for errno constants: the
# numbers differ between macOS and Linux, so matching them by literal would be
# wrong on one of the two. Already in the tree via pavao.
libc = "0.2"
thiserror = "2"
# `statvfs` for the local backend's capacity (E21-S1). Already in the tree via
# xsync-core, and a thin wrapper over `rustix` rather than a new FFI surface.
fs4 = { version = "1", default-features = false }
# The Trash, for the local backend's `remove` (E21-S1). Target-gated in the
# engine's manifest: it has no platform module for iOS or Android.
trash = "5"
# Apple's own drag and drop, for E24-S2's one FFI module (`engine/src/drag`).
# Vetted bindings rather than hand-written `extern` blocks — the middle step of
# the preference order in "Decisions taken" — and every one of these is already
# in the lock file via Tauri, wry and `trash`, so this adds no package and no
# licence to the audit. See docs/supply-chain.md.
#
# E24-S1 adds four feature names and no packages: `NSFilePromiseProvider` for
# the promise and its delegate, `block2` for the completion handler that
# delegate is handed, and `NSError`/`NSOperation`/`NSURL`/`NSDictionary` in
# Foundation for what crosses that one method. Turning a feature on in a crate
# already in the lock file adds nothing to audit.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSApplication", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSFilePromiseProvider", "NSGraphics", "NSGraphicsContext", "NSImage", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSView", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSEnumerator", "NSError", "NSGeometry", "NSObject", "NSOperation", "NSString", "NSURL"] }
# The Objective-C block the file promise delegate has to call to say the file
# has landed. `objc2-app-kit`'s own `block2` feature is what declares it, and
# calling it needs the type by name, so this is a direct dependency of one
# function. Already in the lock file via wry and objc2.
block2 = "0.6"
zeroize = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
