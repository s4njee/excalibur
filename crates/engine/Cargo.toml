[package]
name = "excalibur-engine"
description = "Protocol-agnostic share browsing, transfer and preview engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# An application, not a library: nothing here is meant for crates.io.
# Saying so also lets cargo-deny accept the workspace's path deps.
publish = false

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
# The OS credential store. Default features cover the three platforms this
# targets: Apple Keychain, Secret Service over zbus, and Windows.
keyring = { workspace = true }
zeroize = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
# The whole-file digest a staged commit verifies (E12-S1). Already in the
# tree via xsync-client.
blake3 = "1"
dirs = { workspace = true }
russh = { workspace = true }
russh-sftp = { workspace = true }
nfs3_client = { workspace = true }
# Optional: see `[features]` below and backend/smb.rs.
pavao = { workspace = true, optional = true }
# A path dependency while xsync's v3 branch is local. E7-S0 wants a pinned git
# revision with a documented `[patch]` override for development; that needs the
# branch pushed somewhere first.
#
# Careful: because this points outside the workspace, `cargo fmt --all` reaches
# the whole *xsync* workspace and will rewrite files there — including crates
# Excalibur does not depend on, and someone else's uncommitted work. Format with
# `cargo fmt -p excalibur-engine -p excalibur-cli -p excalibur` instead.
xsync-client = { path = "../../../xsync/crates/xsync-client" }
serde = { workspace = true }
# The transfer queue is persisted as JSON (E13-S1), so it survives a restart.
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[features]
default = []
# The SMB backend. Off by default because turning it on changes the licence of
# the resulting binary: it links libsmbclient, which is GPL-3.0-or-later, so
# the whole executable becomes conveyable only under GPLv3. It also needs
# libsmbclient present at build and run time (`brew install samba`, or
# `libsmbclient-dev`). See docs/decisions/0001-smb-client.md.
smb = ["dep:pavao"]

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread"] }
