[package]
name = "excalibur-engine"
description = "Protocol-agnostic share browsing, transfer and preview engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# An application, not a library: nothing here is meant for crates.io.
# Saying so also lets cargo-deny accept the workspace's path deps.
publish = false

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
# The OS credential store. Default features cover the three platforms this
# targets: Apple Keychain, Secret Service over zbus, and Windows.
keyring = { workspace = true }
zeroize = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
# The whole-file digest a staged commit verifies (E12-S1). Already in the
# tree via xsync-client.
blake3 = "1"
dirs = { workspace = true }
# The local backend's capacity (E21-S1): `statvfs` without hand-written FFI.
fs4 = { workspace = true }
russh = { workspace = true }
russh-sftp = { workspace = true }
nfs3_client = { workspace = true }
# Optional: see `[features]` below and backend/smb.rs.
pavao = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
# A path dependency while xsync's v3 branch is local. E7-S0 wants a pinned git
# revision with a documented `[patch]` override for development; that needs the
# branch pushed somewhere first.
#
# Careful: because this points outside the workspace, `cargo fmt --all` reaches
# the whole *xsync* workspace and will rewrite files there — including crates
# Excalibur does not depend on, and someone else's uncommitted work. Format with
# `cargo fmt -p excalibur-engine -p excalibur-cli -p excalibur` instead.
xsync-client = { path = "../../../xsync/crates/xsync-client" }
# The transfer engine itself (E22-S1): `run_client_push` / `run_client_pull`
# drive a Local↔xsync transfer over an `ssh` session Excalibur spawns and whose
# host-key policy Excalibur keeps. Already in the tree — `xsync-client` depends
# on it — so this promotes a transitive dependency to a named one and adds no
# packages. See `../xsync/docs/library.md` and docs/supply-chain.md.
xsync-core = { path = "../../../xsync/crates/xsync-core" }
# The `Source`/`Sink` seam itself (E22-S2). `xsync-core` does not re-export the
# traits, and a crate that *implements* them is exactly the consumer this crate
# was split out for — its own doc comment names Excalibur. Already in the tree
# via `xsync-core`, so this adds no package.
#
# `version` beside `path` on purpose: cargo-deny's `bans` reads a bare path
# dependency of a crate it considers public as a wildcard, and this repo has
# already been bitten by that (docs/supply-chain.md, "one red gate").
xsync-endpoint = { version = "0.1.0", path = "../../../xsync/crates/xsync-endpoint" }
# HTTP downloads use xsync's Source implementation and the same local planner
# as share transfers. Credentials remain outside this route until keychain
# support is wired by XDL-E7.
xsync-download = { path = "../../../xsync/crates/xsync-download" }
serde = { workspace = true }
# The transfer queue is persisted as JSON (E13-S1), so it survives a restart.
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

# The Trash `remove` moves things to (E21-S1). Gated because `trash` has no
# platform module for iOS or Android; on a target without one the backend
# falls back to a real delete and says so in the mount's options.
[target.'cfg(any(windows, all(unix, not(target_os = "ios"), not(target_os = "android"))))'.dependencies]
trash = { workspace = true }

# The native drag (E24-S2) and the file promises it carries (E24-S1).
# macOS-only: E24-S4 adds the GTK/XDG side, which is a different set of crates,
# so neither is a dependency of the other platform.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-app-kit = { workspace = true }
objc2-foundation = { workspace = true }
block2 = { workspace = true }

[features]
default = []
# The SMB backend. Off by default because turning it on changes the licence of
# the resulting binary: it links libsmbclient, which is GPL-3.0-or-later, so
# the whole executable becomes conveyable only under GPLv3. It also needs
# libsmbclient present at build and run time (`brew install samba`, or
# `libsmbclient-dev`). See docs/decisions/0001-smb-client.md.
smb = ["dep:pavao", "dep:libc"]

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread"] }

# The drag's AppKit objects are main-thread-only and libtest runs every `#[test]`
# on a thread it spawned, so this one owns its own `main` — which *is* the main
# thread. See the file's own header.
[[test]]
name = "promises"
harness = false
