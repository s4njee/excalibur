[package]
name = "excalibur-cli"
description = "Headless driver for the Excalibur engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# An application, not a library: nothing here is meant for crates.io.
# Saying so also lets cargo-deny accept the workspace's path deps.
publish = false

[[bin]]
name = "xcal"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# Only to implement the engine's `BackendSource` for `xcal get`. Already in the
# tree — the engine's own traits are written with it — so this adds nothing to
# audit.
async-trait = { workspace = true }
excalibur-engine = { path = "../engine" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
