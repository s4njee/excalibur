[package]
name = "excalibur"
description = "A share browser for SMB, NFS, SFTP and xsync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "excalibur_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
excalibur-engine = { path = "../crates/engine" }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
# Bookmarks and preferences. Secrets never go here — they go to the OS keychain
# with E3-S3 — so this file is safe to sit in plain JSON under the app's data
# directory.
tauri-plugin-store = "2"
tokio = { workspace = true }
