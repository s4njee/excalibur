[package]
name = "excalibur"
description = "A share browser for SMB, NFS, SFTP and xsync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# An application, not a library: nothing here is meant for crates.io.
# Saying so also lets cargo-deny accept the workspace's path deps.
publish = false

[lib]
name = "excalibur_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
excalibur-engine = { path = "../crates/engine" }
# The default download folder (E13-S4). Already in the tree via the engine.
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
# Bookmarks and preferences. Secrets never go here — they go to the OS keychain
# with E3-S3 — so this file is safe to sit in plain JSON under the app's data
# directory.
tauri-plugin-store = "2"
tokio = { workspace = true }
tauri-plugin-dialog = "2.7.3"
