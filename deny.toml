# Supply-chain policy, enforced in CI. Anything accepted here is recorded with
# the reason it was accepted, so an addition is a deliberate edit rather than a
# silent pass. The sibling xsync repository runs the same discipline.

[graph]
all-features = true

[advisories]
version = 2
# Unmaintained-crate notices, not vulnerabilities. Every one of these arrives
# through Tauri and none is reachable from a dependency we chose directly, so
# there is nothing to swap out here: they clear when Tauri's own tree moves.
# Recorded individually rather than by a blanket `unmaintained = "allow"`, so a
# genuinely new unmaintained crate still fails the build.
ignore = [
  # GTK3 bindings, pulled in by tauri's Linux backend (wry -> gtk). Tauri v2
  # still targets GTK3; migrating is upstream's call, not ours.
  { id = "RUSTSEC-2024-0411", reason = "gtk, via tauri's Linux backend" },
  { id = "RUSTSEC-2024-0412", reason = "gtk-sys, via tauri's Linux backend" },
  { id = "RUSTSEC-2024-0413", reason = "gdk, via tauri's Linux backend" },
  { id = "RUSTSEC-2024-0414", reason = "gdk-sys, via tauri's Linux backend" },
  { id = "RUSTSEC-2024-0415", reason = "gdkwayland-sys, via tauri's Linux backend" },
  { id = "RUSTSEC-2024-0416", reason = "gdkx11, via tauri's Linux backend" },
  { id = "RUSTSEC-2024-0417", reason = "gdkx11-sys, via tauri's Linux backend" },
  { id = "RUSTSEC-2024-0418", reason = "atk, via tauri's Linux backend" },
  { id = "RUSTSEC-2024-0419", reason = "atk-sys, via tauri's Linux backend" },
  { id = "RUSTSEC-2024-0420", reason = "gtk3-macros, via tauri's Linux backend" },
  # Build-time only: these run in proc macros and ship no code in the binary.
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error, build-time only, via tauri-macros" },
  { id = "RUSTSEC-2025-0075", reason = "unic-char-property, build-time only, via tauri-codegen" },
  { id = "RUSTSEC-2025-0080", reason = "unic-char-range, build-time only, via tauri-codegen" },
  { id = "RUSTSEC-2025-0081", reason = "unic-common, build-time only, via tauri-codegen" },
  { id = "RUSTSEC-2025-0098", reason = "unic-ucd-ident, build-time only, via tauri-codegen" },
  { id = "RUSTSEC-2025-0100", reason = "unic-ucd-version, build-time only, via tauri-codegen" },
  # The one entry here that is a *vulnerability* rather than an unmaintained
  # notice, and the one worth arguing about.
  #
  # RUSTSEC-2023-0071 is the Marvin timing side-channel in the `rsa` crate.
  # There is no fixed version: it has been open upstream since 2023 and the
  # fix requires constant-time work nobody has landed. It reaches us through
  # `russh`'s default features, where it exists so that SFTP can use RSA keys.
  #
  # Accepted rather than fixed, because the only fix available to us is
  # `default-features = false` on russh, which removes RSA key support
  # entirely — and RSA is still the key type on a great many servers, so that
  # trades a narrow timing attack for a large number of users unable to
  # connect at all.
  #
  # The exposure: an SSH client *signs* with its private key, it does not
  # decrypt. Recovering the key needs a malicious server able to trigger and
  # precisely time many thousands of signatures — that is, a server the user
  # chose to keep connecting to. It is real, and it is narrow.
  #
  # Revisit if: the `rsa` crate ships a constant-time release, or russh gains
  # a way to keep RSA *verification* without RSA signing.
  { id = "RUSTSEC-2023-0071", reason = "rsa Marvin side-channel, unfixed upstream; see the note above" },
]

[licenses]
version = 2
# Every licence in the tree today. All are permissive and compatible with this
# crate's declared "MIT OR Apache-2.0".
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unlicense",
  "CC0-1.0",
  "Unicode-3.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are an audit-surface problem rather than a correctness
# one, and are usually forced by upstream. Warn so new ones stay visible.
multiple-versions = "warn"
wildcards = "deny"
# Our own crates depend on each other by path with no version, which cargo-deny
# reads as a wildcard. That is how a workspace is meant to look; the ban is here
# to catch a wildcard on a *published* crate, which this still does.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
